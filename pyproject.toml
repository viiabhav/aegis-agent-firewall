[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-firewall"
version = "1.0.0"
description = "Agentic prompt-injection firewall prototype for the ET AI Hackathon"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "Pillow>=10.0",
  "pypdf>=5.0",
  "pytesseract>=0.3.13",
  "python-docx>=1.1",
  "sentence-transformers>=3.0,<6",
  "streamlit>=1.40,<2",
  "fastapi>=0.128,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
